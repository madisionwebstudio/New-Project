# Netlify config: PREVIEW copy of the Hardtland site for the client.
#
#   repo root                  -> this Netlify preview (Netlify Forms, noindex)
#   hardtlandhomeimprovement/  -> the real-domain site (PHP host: admin + lead.php)
#
# Both are generated by: python3 hardtlandhomeimprovement/build/build.py
# Pages are already built, so Netlify just publishes the repo root.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Not part of the preview: the real-domain folder (PHP code, admin, data) and repo files
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/hardtlandhomeimprovement/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Old website URLs -> new pages (keeps links and rankings they earned)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/Accessibility"
  to = "/accessibility/"
  status = 301

[[redirects]]
  from = "/Home/PrivacyPolicy"
  to = "/privacy-policy/"
  status = 301

[[redirects]]
  from = "/Home/TermsOfUse"
  to = "/"
  status = 301

[[redirects]]
  from = "/Home/Index"
  to = "/"
  status = 301

[[redirects]]
  from = "/Home"
  to = "/"
  status = 301

[[redirects]]
  from = "/About"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/Contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/FAQ"
  to = "/faq/"
  status = 301

[[redirects]]
  from = "/Gallery"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/Reviews"
  to = "/reviews/"
  status = 301

[[redirects]]
  from = "/Services"
  to = "/"
  status = 301

[[redirects]]
  from = "/News"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Preview only: keep this copy out of Google. Remove if Netlify ever becomes
    # the real host (and rebuild the netlify target without noindex).
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Photos can be swapped by re-uploading the same file name, so cache for a
# week rather than forever.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
