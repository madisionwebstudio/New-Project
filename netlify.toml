# Netlify config for the Hardtland Home Improvement site.
# The website lives in /hardtlandhomeimprovement. Pages are already built
# (plain HTML), so Netlify only publishes that folder; no build step.

[build]
  publish = "hardtlandhomeimprovement"
  command = ""

# ---------------------------------------------------------------------------
# Private files: never served on Netlify (PHP admin/tools only run on a PHP host)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/inc/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/lead.php"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.htaccess"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Old website URLs -> new pages (keeps links and rankings they earned)
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/Accessibility"
  to = "/accessibility/"
  status = 301

[[redirects]]
  from = "/Home/PrivacyPolicy"
  to = "/privacy-policy/"
  status = 301

[[redirects]]
  from = "/Home/TermsOfUse"
  to = "/"
  status = 301

[[redirects]]
  from = "/Home/Index"
  to = "/"
  status = 301

[[redirects]]
  from = "/Home"
  to = "/"
  status = 301

[[redirects]]
  from = "/About"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/Contact"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/FAQ"
  to = "/faq/"
  status = 301

[[redirects]]
  from = "/Gallery"
  to = "/gallery/"
  status = 301

[[redirects]]
  from = "/Reviews"
  to = "/reviews/"
  status = 301

[[redirects]]
  from = "/Services"
  to = "/"
  status = 301

[[redirects]]
  from = "/News"
  to = "/"
  status = 301

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/thank-you/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# Photos can be swapped by re-uploading the same file name, so cache for a
# week rather than forever.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
